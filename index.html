<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Little Layers — Holiday Gift Guide</title>
<meta name="description" content="Personalized 3D creations from Cape Cod, MA. Order by Instagram DM or WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="logo.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Jost:wght@400;500&display=swap">
<style>
  :root {
    --cream: #f5eee6;
    --paper: #fffdf9;
    --sand: #e6dad0;
    --brown: #5a3a2a;
    --cocoa: #8a5a3c;
    --rose: #d9b8a5;
    --green: #2f6b4f;
    --shadow: 0 6px 24px rgba(74, 42, 29, .08);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--brown);
    font-family: "Jost", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  header { text-align: center; padding: 40px 0 24px; }
  .logo { width: 132px; height: 132px; border-radius: 50%; display: block; margin: 0 auto; box-shadow: var(--shadow); }
  .brand {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: clamp(34px, 8vw, 54px);
    line-height: 1;
    margin: 12px 0 6px;
  }
  .tag { letter-spacing: .2em; line-height: 1.6; text-transform: uppercase; font-size: 12px; color: var(--cocoa); }
  .title { font-family: "Great Vibes", cursive; font-size: clamp(34px, 9vw, 52px); margin: 22px 0 4px; }
  .sub { color: var(--cocoa); margin: 0 auto; max-width: 460px; line-height: 1.5; }

  .deadline {
    margin: 22px auto 0;
    display: inline-block;
    background: var(--brown);
    color: var(--cream);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
  }

  .lead { margin: 12px 0 0; font-size: 14px; color: var(--cocoa); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 8px 0 24px; }
  .chip {
    border: 1px solid var(--sand);
    background: var(--paper);
    color: var(--brown);
    padding: 8px 16px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--brown); color: var(--cream); border-color: var(--brown); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 18px; padding-bottom: 40px; }
  .card { background: var(--paper); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .photo { aspect-ratio: 4 / 5; background: var(--sand); position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.full { aspect-ratio: auto; min-height: 120px; }
  .photo.full img { height: auto; }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Cormorant Garamond", serif; font-size: 22px; color: var(--cocoa); text-align: center; padding: 16px; }
  .badge { position: absolute; top: 12px; left: 12px; background: var(--rose); color: var(--brown); font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .draft { left: auto; right: 12px; background: #fff3c4; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 22px; margin: 0; }
  .desc { color: var(--cocoa); font-size: 14px; line-height: 1.45; margin: 0; }
  .opts { font-size: 13px; color: var(--cocoa); }
  .price { font-size: 18px; font-weight: 500; margin-top: auto; padding-top: 6px; }
  .price.ask { font-size: 15px; color: var(--cocoa); }
  .prices { list-style: none; margin: auto 0 0; padding: 6px 0 0; display: grid; gap: 4px; }
  .prices li { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; border-bottom: 1px dashed var(--sand); padding: 4px 0; }
  .prices strong { font-weight: 500; white-space: nowrap; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 8px; border-radius: 12px; font: inherit; font-size: 14px;
    text-decoration: none; cursor: pointer; border: 0;
  }
  .btn.wa { background: var(--green); color: #fff; }
  .btn.ig { background: var(--brown); color: var(--cream); }
  .btn svg { width: 16px; height: 16px; flex: none; }

  .custom { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 28px 20px; text-align: center; margin-bottom: 40px; }
  .custom h2 { font-family: "Cormorant Garamond", serif; font-size: 30px; margin: 0 0 8px; }
  .custom p { color: var(--cocoa); margin: 0 auto 16px; max-width: 480px; line-height: 1.5; }
  .custom .actions { max-width: 380px; margin: 0 auto; }

  footer { text-align: center; padding: 0 0 40px; color: var(--cocoa); font-size: 14px; }
  footer a { color: var(--brown); }
  .empty { text-align: center; color: var(--cocoa); padding: 40px 0; grid-column: 1 / -1; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: var(--brown); color: var(--cream); padding: 12px 18px; border-radius: 12px;
    font-size: 14px; transition: transform .25s, opacity .25s; max-width: calc(100% - 32px); text-align: center; opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.webp" alt="Two Little Layers logo">
    <h1 class="brand" id="brand">Two Little Layers</h1>
    <div class="tag">Custom creations made layer by layer</div>
    <p class="title" id="title">Holiday Gift Guide</p>
    <p class="sub" id="sub"></p>
    <div class="deadline" id="deadline" hidden></div>
    <p class="lead" id="lead" hidden></p>
  </header>

  <nav class="chips" id="chips" aria-label="Categories"></nav>
  <main class="grid" id="grid"></main>

  <section class="custom">
    <h2>Have an idea? We'll make it.</h2>
    <p>Names, colors, sizes, a little gift for someone special. Tell us what you're dreaming of and we'll bring it to life, one layer at a time.</p>
    <div class="actions" id="customActions"></div>
  </section>

  <footer>
    Made with love in <span id="city">Cape Cod, MA</span> 🤎<br>
    <a id="igLink" href="#" target="_blank" rel="noopener">@twolittlelayers.co</a>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="produtos.js"></script>
<script>
  const loja = window.LOJA;
  const preview = new URLSearchParams(location.search).has("preview");
  const produtos = window.PRODUTOS.filter(p => preview || !p.rascunho);
  const igIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
  const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c.1.2.6 1 1.3 1.6.9.8 1.6 1 1.9 1.2.2.1.4.1.5-.1l.7-.9c.2-.2.3-.2.6-.1l1.8.9c.3.1.4.2.5.3.1.2.1.7-.1 1.2z"/></svg>';

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => "$" + Number(n).toFixed(2).replace(/\.00$/, "");
  const msg = p => p
    ? `Hi Two Little Layers! I'd like to order the ${p.nome}${p.preco != null ? " (" + money(p.preco) + ")" : ""}. 🎄`
    : "Hi Two Little Layers! I have an idea for a custom piece. 🎄";
  const waUrl = p => `https://wa.me/${loja.whatsapp}?text=${encodeURIComponent(msg(p))}`;

  function botoes(p) {
    return `<a class="btn wa" href="${waUrl(p)}" target="_blank" rel="noopener">${waIcon}WhatsApp</a>
            <button class="btn ig" type="button" data-id="${p ? esc(p.id) : ""}">${igIcon}Instagram</button>`;
  }

  // Instagram não aceita mensagem pré-preenchida: copio o texto e abro a DM.
  function abrirDM(p) {
    const texto = msg(p);
    const ir = () => window.open(`https://ig.me/m/${loja.instagram}`, "_blank", "noopener");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(texto).then(() => toast("Message copied! Just paste it in our DM."), () => {}).finally(ir);
    } else ir();
  }

  function toast(t) {
    const el = document.getElementById("toast");
    el.textContent = t;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2600);
  }

  // Foto ainda não enviada: troca pelo aviso sem quebrar o card.
  function semFoto(img) {
    const box = img.parentElement;
    box.classList.remove("full");
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = "Photo coming soon";
    img.replaceWith(ph);
  }

  function card(p) {
    const foto = p.foto
      ? `<img src="${esc(p.foto)}" alt="${esc(p.nome)}" onerror="semFoto(this)">`
      : `<div class="ph">${esc(p.nome)}<br>photo coming soon</div>`;
    const preco = p.precos && p.precos.length
      ? `<ul class="prices">${p.precos.map(o => `<li><span>${esc(o.label)}</span><strong>${money(o.preco)}</strong></li>`).join("")}</ul>`
      : p.preco != null
        ? `<div class="price">${money(p.preco)}</div>`
        : `<div class="price ask">Price on request</div>`;
    const opcoes = p.opcoes && p.opcoes.length ? `<div class="opts">Options: ${p.opcoes.map(esc).join(" · ")}</div>` : "";
    return `<article class="card">
      <div class="photo${p.fotoInteira ? " full" : ""}">${foto}
        ${p.destaque ? '<span class="badge">Best gift</span>' : ""}
        ${p.rascunho ? '<span class="badge draft">Draft</span>' : ""}
      </div>
      <div class="body">
        <h3 class="name">${esc(p.nome)}</h3>
        <p class="desc">${esc(p.descricao)}${p.personalizavel ? " Can be personalized." : ""}</p>
        ${opcoes}${preco}
        <div class="actions">${botoes(p)}</div>
      </div>
    </article>`;
  }

  let filtro = "All";
  function render() {
    const lista = produtos.filter(p => filtro === "All" || p.categoria === filtro);
    document.getElementById("grid").innerHTML = lista.length
      ? lista.map(card).join("")
      : '<p class="empty">New pieces coming soon. Send us a DM!</p>';
  }

  function chips() {
    const usadas = ["All", ...loja.categorias.filter(c => produtos.some(p => p.categoria === c))];
    const nav = document.getElementById("chips");
    nav.innerHTML = usadas.length > 2
      ? usadas.map(c => `<button class="chip" type="button" aria-pressed="${c === filtro}">${esc(c)}</button>`).join("")
      : "";
    nav.onclick = e => {
      if (!e.target.matches(".chip")) return;
      filtro = e.target.textContent;
      chips();
      render();
    };
  }

  document.getElementById("brand").textContent = loja.nome;
  document.getElementById("title").textContent = loja.titulo;
  document.getElementById("sub").textContent = loja.subtitulo;
  document.getElementById("city").textContent = loja.cidade;
  const ig = document.getElementById("igLink");
  ig.href = `https://www.instagram.com/${loja.instagram}`;
  ig.textContent = "@" + loja.instagram;
  if (loja.pedidoAte) {
    const d = document.getElementById("deadline");
    d.textContent = `🎄 Christmas orders close ${loja.pedidoAte}`;
    d.hidden = false;
  }
  if (loja.prazoEntrega) {
    const l = document.getElementById("lead");
    l.textContent = `Made to order · ready in ${loja.prazoEntrega}`;
    l.hidden = false;
  }
  document.getElementById("customActions").innerHTML = botoes(null);
  document.body.addEventListener("click", e => {
    const b = e.target.closest(".btn.ig");
    if (b) abrirDM(produtos.find(p => p.id === b.dataset.id) || null);
  });

  chips();
  render();
</script>
</body>
</html>
